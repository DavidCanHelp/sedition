{{- if .Values.auth.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poc-blockchain.fullname" . }}-auth
  labels:
    {{- include "poc-blockchain.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ .Values.auth.jwtSecret | b64enc | quote }}
  api-key: {{ .Values.auth.apiKey | b64enc | quote }}
{{- end }}
---
{{- if .Values.validator.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poc-blockchain.fullname" . }}-validator
  labels:
    {{- include "poc-blockchain.labels" . | nindent 4 }}
type: Opaque
data:
  private-key: {{ .Values.validator.privateKey | b64enc | quote }}
  public-key: {{ .Values.validator.publicKey | b64enc | quote }}
{{- end }}
---
{{- if .Values.tls.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "poc-blockchain.fullname" . }}-tls
  labels:
    {{- include "poc-blockchain.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.cert | b64enc | quote }}
  tls.key: {{ .Values.tls.key | b64enc | quote }}
{{- end }}