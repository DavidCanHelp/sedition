apiVersion: v1
kind: Service
metadata:
  name: {{ include "poc-blockchain.fullname" . }}
  labels:
    {{- include "poc-blockchain.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.p2pPort }}
      targetPort: p2p
      protocol: TCP
      name: p2p
    - port: {{ .Values.service.wsPort }}
      targetPort: websocket
      protocol: TCP
      name: websocket
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "poc-blockchain.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "poc-blockchain.fullname" . }}-headless
  labels:
    {{- include "poc-blockchain.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.service.p2pPort }}
      targetPort: p2p
      protocol: TCP
      name: p2p
  selector:
    {{- include "poc-blockchain.selectorLabels" . | nindent 4 }}